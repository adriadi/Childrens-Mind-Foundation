<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lumi — interactive preview | The Children's Mind Foundation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--sky:#41A8F5;--sky-deep:#16324A;--sunset:#E97132;--lime:#92D14F;--ink:#16324A;--white:#fff}
*{box-sizing:border-box}
body{margin:0;font-family:'Inter',sans-serif;background:linear-gradient(170deg,var(--sky),var(--sky-deep));min-height:100vh;color:var(--white)}
.top-bar{display:flex;align-items:center;gap:24px;max-width:1180px;margin:0 auto;padding:24px 20px;flex-wrap:wrap}
.header{text-align:left;padding:0;max-width:none;margin:0}
.header p{font-size:.85rem;opacity:.85;margin:4px 0 0;max-width:560px}
.title-group{display:flex;flex-direction:column}
.title-group h1{font-family:'Baloo 2',sans-serif;font-size:clamp(1.3rem,3vw,1.8rem);margin:0}
.back-link{display:inline-flex;align-items:center;gap:8px;color:var(--white);text-decoration:none;font-family:'Baloo 2',sans-serif;font-weight:600;font-size:1rem;padding:10px 20px;border:2px solid rgba(255,255,255,.6);border-radius:99px;transition:background .15s ease,transform .15s ease}
.back-link:hover{background:rgba(255,255,255,.15);transform:translateY(-2px)}

.book-wrap{max-width:960px;margin:0 auto;padding:0 20px 64px}
.book-frame{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25);border-radius:28px;padding:8px;box-shadow:0 20px 50px -20px rgba(22,50,74,.5)}
iframe{width:100%;height:650px;border:0;border-radius:22px;background:transparent;display:block}
@media (max-width:640px){
body{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
.top-bar{padding:10px 12px;gap:12px}
.title-group h1,.header{display:none}
.book-wrap{flex:1;min-height:0;padding:0 8px 8px;display:flex;flex-direction:column;gap:8px}
.book-frame{flex:1;min-height:0;display:flex;padding:6px}
iframe{flex:1;height:auto;min-height:0}
.cta-row{margin-top:0}
.btn{padding:10px 20px;font-size:.9rem}
}
.cta-row{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin-top:28px}
.btn{display:inline-flex;align-items:center;gap:10px;font-family:'Baloo 2',sans-serif;font-weight:600;font-size:1rem;padding:14px 28px;border-radius:99px;border:2px solid transparent;text-decoration:none;transition:transform .15s ease,box-shadow .15s ease,background .15s ease}
.btn-primary{background:var(--sunset);color:var(--white);box-shadow:0 10px 22px -8px rgba(233,113,50,.55)}
.btn-primary:hover{background:#cf5f22;transform:translateY(-2px)}
a{color:var(--white)}
a:hover{color:var(--lime)}
</style>
</head>
<body>
<div class="top-bar"><a href="index.html" class="back-link" onclick="if(window.history.length>1){event.preventDefault();window.history.back();}">← Back</a><div class="title-group"><h1>Lumi — a brave bear's Ben Nevis adventure</h1><div class="header">
<p>Flip through the free interactive preview below. Colour the pages, turn with the arrows, and see Lumi's story come to life.</p>
</div></div></div>
<div class="book-wrap">
<div class="book-frame"><iframe src="lumi-preview/index.html" title="Lumi interactive coloring book preview" allowtransparency="true"></iframe></div>
<div class="cta-row"><a class="btn btn-primary" href="https://www.justgiving.com/crowdfunding/thecmf?utm_medium=CF&amp;utm_source=CL" target="_blank" rel="noopener">Gift a book to a child (£5)</a></div>
</div>
</body>
</html>
